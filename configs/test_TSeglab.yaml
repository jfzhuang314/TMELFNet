defaults:
  - ds_T3DSPlusDataset
#  - ds_TADPMSegDataset
  - _self_

# 模块路径定义
transform_module: "datasets.transform.t3dsPlus_transforms"         # 通用数据处理模块
point_sampling_module: "datasets.transform.PointSamplingIndexer"   # 采样策略模块，这部分比较复杂，需要单独配置
vis_module: "datasets.transform.VisRenderSaver"

#------------------------ 项目路径配置---------------------------#
project_dir: "C:/Users/win10/DualMesh/pynb/paraTeeth"
dataset_dir: "E:/mesh_datasets/3DTeeth"

#------------------------ pre_transform 配置---------------------------#
#pretrans_name: fps_16000   # pretransforms配置，[fps_24000, fps_16000, qslim_10000]
#pretrans_name: comb_default   # pretransforms配置，[fps_24000, fps_16000, qslim_10000]
pretrans_name: qslim_10000   # qslim_10000
prefilter_name: default            # prefilter配置
transforms_name: comb_default           # transforms配置，后续增加
val_transforms_name: comb_default


exp_name: "exp_TSeglab_${pretrans_name}"
sample_ratio: 1.0

norm_sel: mean_scale  # [zscore_scalar, yminmax,mean_scale]


# 使用导入的预处理配置
#pre_transform_obj: ${pretrans_combs.${pretrans_name}}
pretrans_combs:
  comb_default:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.mean_scale}
      - ${normalizations.XoYPCA_pose_normalize}
  fps_16000:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.${norm_sel}}
      - ${normalizations.XoYPCA_pose_normalize}
#      - ${gt_edge_mask.face_inconsist_edge_mask}
      - ${sam_methods.fps_16000}
      - ${gt_edge_mask.dynamic_radius_nn_edge_mask}
      - ${inst_cent_methods.label_scatter}

  fps_24000:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.${norm_sel}}
      - ${normalizations.pose_normalize}
      - ${gt_edge_mask.face_inconsist_edge_mask}
      - ${sam_methods.fps_24000}
      - ${inst_cent_methods.label_scatter}
  qslim_10000:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.${norm_sel}}
      - ${normalizations.XoYPCA_pose_normalize}
      - ${sam_methods.qslim_10000}
      - ${gt_edge_mask.dynamic_radius_nn_edge_mask}
      - ${inst_cent_methods.label_scatter}

pre_filters:
  default: null

trans_combs:
  comb_default: null


pre_transform_obj: ${pretrans_combs.${pretrans_name}}
transform_obj: ${trans_combs.${transforms_name}}
pre_filter_obj: ${pre_filters.${prefilter_name}}

#------------------------ 数据集路径配置---------------------------#
paths:
  source_obj_data_path: ${dataset_dir}/data
  source_seg_json_data_path: ${dataset_dir}/data
  source_landmarks_json_data_path: ${dataset_dir}/3DTeethLand_landmarks_train
  save_data_path: ${dataset_dir}/data
  save_jsondata_path: ${dataset_dir}/jsondata
  save_imgs_path: ${dataset_dir}/imgs
  config_dir: ${project_dir}/datasets/configs

  base_path: "${paths.project_dir}/model/"
  exp_name: ${exp_name}
  logger_path: "${paths.base_path}/pl_logs/"

  project_dir: "C:/Users/win10/DualMesh/pynb/paraTeeth"
  tseglab_path: "${paths.save_data_path}/${dataset.name}/tseglab_processed/${pretrans_name}"
  tseglab_images_path: ${paths.tseglab_path}/__split__/images
  tseglab_masks_path: ${paths.tseglab_path}/__split__/masks
  tseglab_tmp_path: ${paths.tseglab_path}/__split__/tmp

  tseglab_pred_path: "${paths.save_data_path}/${dataset.name}/tseglab_processed/${pretrans_name}"


# 数据集配置
dataset:
  pre_transform_obj: ${pretrans_combs.${pretrans_name}}
  transform_obj: ${trans_combs.${transforms_name}}
  val_transform_obj: ${trans_combs.${val_transforms_name}}
  pre_filter_obj: ${pre_filters.${prefilter_name}}
  pretrans_name: ${pretrans_name}

  # 数据集参数
  sample_ratio: ${sample_ratio}
  rseed: 42
  batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true

  # 一些老参数
  ncells: 10000
  kfold_nums: 5
  use_fold: 1

  # dataset相关的参数
  is_filter_small_instance: true
  filter_small_instance_size: 30
  recompute: False

  # train_split 拆分
  folds:
    fold_path: ${paths.dataset_dir}/Teeth3DS_train_test_split/origin
    fold_filename: "testing_full.txt"

  # 排除文件配置
  exclude_files:
    - "K4BAII5F_upper"
    - "87N5YSES_upper"
    - "67PV9M7X_lower"
    - "S0AON6PZ_lower"

# 数据集特定配置
t3dsplus:
  is_filter_small_instance: true
  filter_small_instance_size: 30
  recompute: true

# 折叠配置
folds:
  fold_path: ${project_dir}/datasets/folds
  fold_filename: "cityu_fold_0.txt"

# 排除文件配置
exclude_files:
  - "K4BAII5F_upper"
  - "87N5YSES_upper"
  - "67PV9M7X_lower"
  - "S0AON6PZ_lower"



