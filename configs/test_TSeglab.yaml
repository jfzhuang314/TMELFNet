vis:
  # 基础配置模板
  base_config: &base_config
    _target_: ${vis_module}.VisRenderSaver
    window_size: [800, 600]
    window_visible: false
    save_file: true
    root: ${paths.save_imgs_path}
    view_mode: "top"
    light_on: true
    zoom: 0.5

  # Mesh 配置模板
  mesh_config: &mesh_config
    <<: *base_config
    data_mode: "mesh"
    mesh_show_wireframe: false
    mesh_color_option: 1
    mesh_shade_option: 0
    palette: ${palettes.platte15}

  # Point 配置模板
  point_config: &point_config
    <<: *base_config
    data_mode: "point"
    point_size: 2.0

  # 具体配置项
  vis_render_saver:
    <<: *point_config
    classname: "T3DSPlusSegDataset/points"
    color_mode: "uniform_color"
    uniform_color: [0.5, 0.5, 0.5]

  point_edge_saver:
    <<: *point_config
    classname: "T3DSPlusSegDataset/point_edge_knn/"
    color_mode: "edge_color"


  instcent_render_saver:  &instcent_render_saver
    <<: *point_config
    _target_: ${vis_module}.InstCentRenderSaver
    classname: "T3DSPlusSegDataset/instcent_points"
    color_mode: "uniform_color"
    point_size: 1.0
    mesh_color_option: 1
    uniform_color: [0.5, 0.5, 0.5]
    cent_color: [0.0, 1.0, 0.0]
    cent_radius: 0.01
    light_on: true

  mesh_uniform_saver:
    <<: *mesh_config
    classname: "T3DSPlusSegDataset/orginmesh_uniform/"
    color_mode: "uniform_color"
    uniform_color: [0.5, 0.5, 0.5]
    mesh_color_option: 0

  mesh_label_lighton_saver:
    <<: *mesh_config
    classname: "T3DSPlusSegDataset/orginmesh_label_lighton/"
    color_mode: "label_color"

  mesh_label_lightoff_saver:
    <<: *mesh_config
    classname: "T3DSPlusSegDataset/orginmesh_label_lightoff/"
    color_mode: "label_color"
    light_on: false

  mesh_edge_lighton_saver:
    <<: *mesh_config
    classname: "T3DSPlusSegDataset/orginmesh_edge_lighton/"
    color_mode: "edge_color"

  qslim_10000_mesh_label_lighton_saver:
    <<: *mesh_config
    classname: "T3DSPlusSegDataset/qslim_10000_mesh_label_lighton/"
    color_mode: "label_color"

  qslim_10000_mesh_edge_lighton_saver:
    <<: *mesh_config
    classname: "T3DSPlusSegDataset/qslim_10000_mesh_edge_lighton/"
    color_mode: "edge_color"

  qslim_10000_mesh_instcent_render_saver:  &qslim_10000_instcent_render_saver
    <<: *mesh_config
    _target_: ${vis_module}.InstCentRenderSaver
    classname: "T3DSPlusSegDataset/qslim_10000_instcent_mesh"
    color_mode: "uniform_color"
    point_size: 1.0
    mesh_color_option: 1
    uniform_color: [0.5, 0.5, 0.5]
    cent_color: [0.0, 1.0, 0.0]
    cent_radius: 0.01
    light_on: true

  ray_blend_render_saver:
    <<: *qslim_10000_instcent_render_saver
    _target_: ${vis_module}.RayBlendRenderSaver
    classname: "T3DSPlusSegDataset/ray_blend_mesh"
    cent_color: [ 0.0, 1.0, 0.0 ]
    cent_radius: 0.01
    proj_cent_color: [ 1.0, 0.0, 0.0 ]
    proj_cent_radius: 0.01
    radius_threshold: 0.03
    window_visible: true

  spee_curv_render_saver:
    <<: *qslim_10000_instcent_render_saver
    _target_: ${vis_module}.SpeeCurveRenderSaver
    classname: "T3DSPlusSegDataset/spee_curv_qslim_10000_mesh"
    cent_color: [ 0.0, 1.0, 0.0 ]
    cent_radius: 0.01
    window_visible: true
