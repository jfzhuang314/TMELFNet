cluster:
  topo_moprh_cluster:
    _target_: ${cluster_module}.TopoMorphCluster
    num_classes: ${tmc_cluster.num_classes}                          # 类别数
    predictor_type: ${tmc_cluster.predictor_type}                    # 预测器类型
    ckpt_path: ${tmc_cluster.ckpt_path}                              # 模型检查点路径
    net_para_name: ${tmc_cluster.net_para_name}                      # 网络参数名称
    mounted_segnet_outputs: ${tmc_cluster.mounted_segnet_outputs}    # 是否挂载SegNet输出，理由包含了丰富的信息
    mounted_knn_ica_meshes: ${tmc_cluster.mounted_knn_ica_meshes}          # 是否可视化KNN-ICA结果
    mounted_mask_outputs: ${tmc_cluster.mounted_mask_outputs}          # 是否挂载mask输出
    filter_type: ${tmc_cluster.filter_type}                          # 过滤类型，包含bg、tae、tae_tte、tae_tte_gtte、tae_tte_ptte、tae_tte_ptae
    aggr_type: ${tmc_cluster.aggr_type}                              # 聚合类型。默认为布尔聚合;包含boolean, add两种方式
    small_cluster_size_thre: ${tmc_cluster.small_cluster_size_thre}  # 过滤小聚类大小的阈值
    alpha: ${tmc_cluster.alpha}                                      # alpha边长阈值
    k: ${tmc_cluster.k}                                              # KNN-ICA迭代邻域数
    max_iter: ${tmc_cluster.max_iter}                                # KNN-ICA最大迭代次数
    iter_thred_len_ratio: ${tmc_cluster.iter_thred_len_ratio}        # KNN-ICA迭代阈值长度比率
    field_bound_ratio: ${tmc_cluster.field_bound_ratio}              # UL线段带宽比率
    field_sigma_ratio: ${tmc_cluster.field_sigma_ratio}              # 距离带宽比率

  load_tmc_props:
    _target_: ${cluster_module}.LoadTMCProposal
    tmc_path: ${paths.tmc_path}
    pt: ${tmc_cluster.predictor_type}
    npn: ${tmc_cluster.net_para_name}
    ft: ${tmc_cluster.filter_type}
    at: ${tmc_cluster.aggr_type}
    scs: ${tmc_cluster.small_cluster_size_thre}
    alpha: ${tmc_cluster.alpha}
    k: ${tmc_cluster.k}
    mi: ${tmc_cluster.max_iter}
    itlr: ${tmc_cluster.iter_thred_len_ratio}
    fbr: ${tmc_cluster.field_bound_ratio}
    fsr: ${tmc_cluster.field_sigma_ratio}
    td: ${tmc_cluster.thre_dist}
    cn: ${tmc_cluster.ckpt_name}

#------------------------变换修改---------------------------#
# 使用导入的预处理配置
pretrans_combs:
  fps_16000_tmc:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.mean_scale}
      - ${normalizations.XoYPCA_pose_normalize}
      - ${sam_methods.mounted_qslim_8192}
      - ${sam_methods.fps_16000}
      - ${gt_edge_mask.dynamic_radius_nn_edge_mask}
      - ${inst_cent_methods.label_scatter}

  fps_16000_knnthred_tmc:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.mean_scale}
      - ${normalizations.XoYPCA_pose_normalize}
      - ${sam_methods.mounted_qslim_8192}
      - ${sam_methods.fps_16000}
      - ${gt_edge_mask.knn_thre_edge_mask}
      - ${inst_cent_methods.label_scatter}


  fps_16000_tmc_tadpm:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.mean_scale}
      - ${normalizations.tadpm_pose_normalize}
      - ${sam_methods.mounted_qslim_8192}
      - ${sam_methods.fps_16000}
      - ${gt_edge_mask.dynamic_radius_nn_edge_mask}
      - ${inst_cent_methods.label_scatter}

#      - ${vis.fps_16000.point_label_lighton_saver}    # save fps_16000_point_label_lighton
#      - ${vis.fps_16000.point_edge_lighton_saver}     # save fps_16000_point_edge_lighton
#      - ${vis.fps_16000.point_tte_lighton_saver}      # save fps_16000_point_tte_lighton

  fps_16000_tmc_knnthred_tadpm:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.mean_scale}
      - ${normalizations.tadpm_pose_normalize}
      - ${sam_methods.mounted_qslim_8192}
      - ${sam_methods.fps_16000}
      - ${gt_edge_mask.knn_thre_edge_mask}
      - ${inst_cent_methods.label_scatter}

      - ${vis.fps_16000.point_label_lighton_saver}    # save fps_16000_point_label_lighton
      - ${vis.fps_16000.point_edge_lighton_saver}     # save fps_16000_point_edge_lighton
      - ${vis.fps_16000.point_tte_lighton_saver}      # save fps_16000_point_tte_lighton



trans_combs:
  # 由于进行了姿态调整，因而当前阶段仅做旋转和缩放。
  rotz_scale :
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${train_transforms}.random_z_axis_rotate
      - ${train_transforms}.random_scale

  rotz_scale_tmc:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${train_transforms.random_z_axis_rotate}
      - ${train_transforms.random_scale}
      - ${cluster.topo_moprh_cluster}

pre_filters:
  default: null

pre_transform_obj: ${pretrans_combs.${pretrans_name}}
transform_obj: ${trans_combs.${transforms_name}}
pre_filter_obj: ${pre_filters.${prefilter_name}}


#数据集配置
dataset:
  pre_transform_obj: ${pretrans_combs.${pretrans_name}}
  transform_obj: ${trans_combs.${transforms_name}}
  val_transform_obj: ${trans_combs.${val_transforms_name}}
  pre_filter_obj: ${pre_filters.${prefilter_name}}
  pretrans_name: ${pretrans_name}

  # 数据集参数
  sample_ratio: ${sample_ratio}
  rseed: 42
  batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true

  # 一些老参数
  ncells: 10000
  kfold_nums: 5
  use_fold: 1

  # dataset相关的参数
  is_filter_small_instance: true
  filter_small_instance_size: 30
  recompute: False

