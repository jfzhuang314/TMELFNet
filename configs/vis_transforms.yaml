    _target_: ${vis_module}.InstCentRenderSaver
    classname: "${vis.this_classname}/qslim_10000_instcent_mesh"
    color_mode: "uniform_color"
    point_size: 1.0
    mesh_color_option: 1
    uniform_color: [0.5, 0.5, 0.5]
    cent_color: [0.0, 1.0, 0.0]
    cent_radius: 0.01
    light_on: true

  fps_16000:
