
defaults:
  - _self_

# 模块路径定义
vis_module: "datasets.transform.VisRenderSaver"

#--------------------------------vis------------------------------------------#
vis:
  paths: ${paths}
  this_classname: "TADPMSegDataset"

  # 基础配置模板
  base_config: &base_config
    _target_: ${vis_module}.VisRenderSaver
    window_size: [800, 600]
    window_visible: false
    save_file: true
    root: ${vis.paths.save_imgs_path}
    view_mode: "top"
    light_on: true
    zoom: 0.5

  # Mesh 配置模板
  mesh_config: &mesh_config
    <<: *base_config
    data_mode: "mesh"
    mesh_show_wireframe: false
    mesh_color_option: 1
    mesh_shade_option: 0
    palette: ${palettes.platte15}

  # Point 配置模板
  point_config: &point_config
    <<: *base_config
    data_mode: "point"
    point_size: 2.0
    palette: ${palettes.platte15}

  # 具体配置项
  vis_render_saver:
    <<: *point_config
    classname: "${vis.this_classname}/points"
    color_mode: "uniform_color"
    uniform_color: [0.5, 0.5, 0.5]

  point_edge_saver:
    <<: *point_config
    classname: "${vis.this_classname}/point_edge_knn/"
    color_mode: "edge_color"


  instcent_render_saver:  &instcent_render_saver
    <<: *point_config
    _target_: ${vis_module}.InstCentRenderSaver
    classname: "${vis.this_classname}/instcent_points"
    color_mode: "uniform_color"
    point_size: 1.0
    mesh_color_option: 1
    uniform_color: [0.5, 0.5, 0.5]
    cent_color: [0.0, 1.0, 0.0]
    cent_radius: 0.01
    light_on: true

  mesh_uniform_saver:
    <<: *mesh_config
    classname: "${vis.this_classname}/orginmesh_uniform/"
    color_mode: "uniform_color"
    uniform_color: [0.5, 0.5, 0.5]
    mesh_color_option: 0

  mesh_label_lighton_saver:
    <<: *mesh_config
    classname: "${vis.this_classname}/orginmesh_label_lighton/"
    color_mode: "label_color"

  mesh_label_lightoff_saver:
    <<: *mesh_config
    classname: "${vis.this_classname}/orginmesh_label_lightoff/"
    color_mode: "label_color"
    light_on: false

  mesh_edge_lighton_saver:
    <<: *mesh_config
    classname: "${vis.this_classname}/orginmesh_edge_lighton/"
    color_mode: "edge_color"

  qslim_10000:
    mesh_label_lighton_saver:
      <<: *mesh_config
      classname: "${vis.this_classname}/qslim_10000_mesh_label_lighton/"
      color_mode: "label_color"
  #    show_coordinate_frame: true
  #    window_visible: true

    mesh_edge_lighton_saver:
      <<: *mesh_config
      classname: "${vis.this_classname}/qslim_10000_mesh_edge_lighton/"
      color_mode: "edge_color"

    mesh_tte_lighton_saver:
      <<: *mesh_config
      classname: "${vis.this_classname}/qslim_10000_mesh_tte_lighton/"
      color_mode: "tte_color"

    pred_label_saver:
      <<:  *mesh_config
      classname: "${vis.this_classname}/qslim_10000_pred_label/"
      color_mode: "label_color"

    pred_bg_saver:
      <<:  *mesh_config
      classname: "${vis.this_classname}/qslim_10000_pred_bg/"
      color_mode: "label_color"

    pred_edge_saver:
      <<:  *mesh_config
      classname: "${vis.this_classname}/qslim_10000_pred_edge/"
