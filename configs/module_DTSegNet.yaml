#      - ${vis.ba_fps_16000.point_edge_lighton_saver}     # save fps_16000_point_edge_lighton
#      - ${vis.ba_fps_16000.point_tte_lighton_saver}      # save fps_16000_point_tte_lighton

  ba_fps_16000_095:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${normalizations.mean_scale}
      - ${sam_methods.ba_fps_16000_095}
      - ${normalizations.XoYPCA_pose_normalize}
      - ${gt_edge_mask.dynamic_radius_nn_edge_mask}    # generate tae, tte
      - ${inst_cent_methods.label_scatter}             # instance centroids
      #  save visualizations
#      - ${vis.ba_fps_16000.point_label_lighton_saver}    # save fps_16000_point_label_lighton
#      - ${vis.ba_fps_16000.point_edge_lighton_saver}     # save fps_16000_point_edge_lighton
#      - ${vis.ba_fps_16000.point_tte_lighton_saver}      # save fps_16000_point_tte_lighton

trans_combs:
  # 由于进行了姿态调整，因而当前阶段仅做旋转和缩放。
  rotz_scale :
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${train_transforms.random_z_axis_rotate}
      - ${train_transforms.random_scale}
  rel_knn_dist_tadpm:
    _target_: torch_geometric.transforms.Compose
    transforms:
      - ${train_transforms.rel_knn_dist}


pre_filters:
  default: null


#数据集配置
dataset:
  pre_transform_obj: ${pretrans_combs.${pretrans_name}}
  transform_obj: ${trans_combs.${transforms_name}}
  val_transform_obj: ${trans_combs.${val_transforms_name}}
  pre_filter_obj: ${pre_filters.${prefilter_name}}
  pretrans_name: ${pretrans_name}

  # 数据集参数
  sample_ratio: ${sample_ratio}
  rseed: 42
  batch_size: 1
  num_workers: 4
  pin_memory: true
  persistent_workers: true

  # 一些老参数
  ncells: 10000
  kfold_nums: 5
  use_fold: 1

  # dataset相关的参数
  is_filter_small_instance: true
  filter_small_instance_size: 30
  recompute: False

#  # train_split 拆分
#  folds:
#    fold_path: ${paths.dataset_dir}/Teeth3DS_train_test_split/origin
#    fold_filename: "testing_full.txt"

  # 排除文件配置
  exclude_files:
    - "K4BAII5F_upper"
    - "87N5YSES_upper"
    - "67PV9M7X_lower"
    - "S0AON6PZ_lower"


# 模型保存配置
# 模型保存配置
ckpt:
  ckpt_path: ${paths.ckpt_path}
  exp_name: "${paths.exp_name}/${training.lr}lr_${dataset.sample_ratio}ratio_${model.loss_type}_\
              ${dataset.name}_${model.name}_${model.net_name}_${model.net_para_name}"
  monitor_metric: "test/loss"
  monitor_mode: "min"
  save_top_k: 1
  save_last: True

# 日志配置
logger:
  save_dir: "${paths.logger_path}"
  task_name: ${paths.exp_name}
  exp_name: ${paths.exp_name}
  add_prefix: False
  use_tensorboard: False
  use_csv: True
  use_wandb: False
  wandb_entity: None
  flush_logs_every_n_steps: 15
  # 实验参数配置（引用已有字段）
  exp_args:
    ncls: "${model.num_classes}"       # 引用 model.num_classes
    nepochs: "${training.num_epochs}"      # 引用 training.num_epochs
    lr: "${training.lr}"                      # 引用 training.lr
    sr: "${dataset.sample_ratio}"
    lt: "${model.loss_type}"
    ds: "${dataset.name}"
    mdl: "${model.name}"
    net: "${model.net_name}"
    npara: "${model.net_para_name}"
    v: "1.0"                 # 版本号



# 训练配置
training:
  num_epochs: ${num_epochs}
  version: "1.0"
  lr: ${lr}
  log_every_n_steps: 20
  check_val_every_n_epoch: 3
  precision: '16-mixed'

prediction:
#  model_name: "segnet.ckpt"
#  model_path: "${paths.ckpt_path}/${paths.exp_name}/${prediction.model_name}"

  # 模型路径
#  model_path: ${paths.ckpt_path}/exp_DTSegNet_fps_16000/0.002lr_0.3ratio_SEG_TAE_TTE_CBL_T3DSPlusSegDataset_DTSegNetModule_DTSegNet_seg_base
#  model_name: last.ckpt

  # seg+tae+tte+cbl
  model_path: ${paths.ckpt_path}/exp_DTSegNet_fps_16000\0.002lr_1.0ratio_SEG_TAE_TTE_CBL_T3DSPlusSegDataset_DTSegNetModule_DTSegNet_seg_base
  model_name: model-18-0.3532.ckpt

#  # only SEG loss
#  model_path: ${paths.ckpt_path}/exp_DTSegNet_fps_16000/0.002lr_1.0ratio_SEG_T3DSPlusSegDataset_DTSegNetModule_DTSegNet_seg_base
#  model_name: model-11-0.1787.ckpt

networks:
  seg_base: &seg_base
    # 边缘图卷积块配置
    edge_conv_blocks:
      - in_channels: ${model.feature_dim}
        out_channels: 24
        hidden_channels: 24
        kernel_size: 32
        edge_function: "local_global"
      - {in_channels: 24, out_channels: 24, hidden_channels: 24, kernel_size: 32, edge_function: "local_global"}
      - {in_channels: 24, out_channels: 24, hidden_channels: 24, kernel_size: 32, edge_function: "local_global"}

    # 膨胀卷积块配置
    dilated_conv_blocks:
      - {in_channels: 60, out_channels: 60, hidden_channels: 60, kernel_size: 32, edge_function: "local_global",
         dilation_rate: 200}
      - {in_channels: 60, out_channels: 60, hidden_channels: 60, kernel_size: 32, edge_function: "local_global",
         dilation_rate: 900}
      - {in_channels: 60, out_channels: 60, hidden_channels: 60, kernel_size: 32, edge_function: "local_global",
         dilation_rate: 2700}

    # 隐藏层配置
    hidden_layers:
      local_feature_compression: {in_channels: 72, out_channels: 60}
      global_feature_compression: {in_channels: 240, out_channels: 1024}
      cbl_feature_compression: {in_channels: 256, out_channels: 32}


    # 残差块配置
    residual_blocks:
      - {in_channels: 1024, hidden_channels: 512, out_channels: 512}
      - {in_channels: 512, hidden_channels: 256, out_channels: 256}

    # 输出头配置
    output_heads:
      semantic_segmentation: {in_channels: 256, out_channels: 15}
      edge_segmentation: {in_channels: 256, out_channels: 2}
      tte_segmentation: {in_channels: 256, out_channels: 2}
      tg_segmentation: {in_channels: 256, out_channels: 2}
    stn_transform: {input_channels: 6, layers: [64, 128, 1024]}
    feature_attention: {in_channels: 1024, activation: "sigmoid"}

    num_classes: ${model.num_classes}
    feature_dim: ${model.feature_dim}
    add_cbl: ${model.add_cbl}


  seg_bin: &seg_bin
    # 边缘图卷积块配置
    edge_conv_blocks:
      - in_channels: ${model.feature_dim}
        out_channels: 24
        hidden_channels: 24
        kernel_size: 24
        edge_function: "local_global"
      - {in_channels: 24, out_channels: 24, hidden_channels: 24, kernel_size: 24, edge_function: "local_global"}
      - {in_channels: 24, out_channels: 24, hidden_channels: 24, kernel_size: 24, edge_function: "local_global"}

    # 膨胀卷积块配置
    dilated_conv_blocks:
      - {in_channels: 60, out_channels: 60, hidden_channels: 60, kernel_size: 24, edge_function: "local_global",
         dilation_rate: 32}
      - {in_channels: 60, out_channels: 60, hidden_channels: 60, kernel_size: 24, edge_function: "local_global",
         dilation_rate: 128}
      - {in_channels: 60, out_channels: 60, hidden_channels: 60, kernel_size: 24, edge_function: "local_global",
         dilation_rate: 512}

    # 隐藏层配置
    hidden_layers:
      local_feature_compression: {in_channels: 72, out_channels: 60}
      global_feature_compression: {in_channels: 240, out_channels: 512}
      cbl_feature_compression: {in_channels: 256, out_channels: 32}


    # 残差块配置
    residual_blocks:
      - {in_channels: 512, hidden_channels: 512, out_channels: 512}
      - {in_channels: 512, hidden_channels: 256, out_channels: 256}

    # 输出头配置
    output_heads:
      semantic_segmentation: {in_channels: 256, out_channels: 15}
      edge_segmentation: {in_channels: 256, out_channels: 2}
      tte_segmentation: {in_channels: 256, out_channels: 2}

    stn_transform: {input_channels: 6, layers: [64, 128, 512]}
    feature_attention: {in_channels: 512, activation: "sigmoid"}

    num_classes: ${model.num_classes}
    feature_dim: ${model.feature_dim}
    add_cbl: ${model.add_cbl}


# 模型配置
model:
  name: ${module_name}
  net_name: ${net_name}
  net_para_name: ${net_para_name}
  loss_type: ${loss_type} # TAE_TTE, SEG_TAE_TTE,SEG

  version: "1.0"
  num_classes: ${num_classes}
  feature_dim: ${feature_dim}
  lr: ${training.lr}
  num_epochs: ${training.num_epochs}
  num_batches_to_print: 150

  # 网络参数
  net_params: ${networks.${model.net_para_name}}

  k: 8
  lamb: 0.1
  dropout: 0.3
  compute_edge_binary_iou: True
  add_cbl: False



