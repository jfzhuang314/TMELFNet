defaults:
#  - ds_T3DSPlusDataset
  - ds_TADPMSegDataset
  - _self_

# 模块路径定义
transform_module: "datasets.transform.t3dsPlus_transforms"         # 通用数据处理模块
point_sampling_module: "datasets.transform.PointSamplingIndexer"   # 采样策略模块，这部分比较复杂，需要单独配置

# 说明：
# 1. ds_T3DSPlusDataset存储着与T3DSPlusDataset相关的配置
# 2. ds_TADPMSegDataset存储着与TADPMSegDataset相关的配置
# 3. 这两个配置文件主要是存储一些paths信息，以更好地区分不同数据集的路径

#------------------------ 模块配置---------------------------#
# transforms
prefilter_name: default            # prefilter配置

# for ds_T3DSPlusDataset
#transforms_name: comb_default    # transforms配置，[comb_default, rotz_scale]
#val_transforms_name: comb_default
#pretrans_name: fps_16000_tmc
#feature_dim: 6

# for ds_TADPMSegDataset
transforms_name: comb_default    # transforms配置，[comb_default, rotz_scale]
val_transforms_name: comb_default
pretrans_name: fps_16000_tmc_tadpm  # pretransforms配置，[fps_24000, fps_16000, qslim_10000, ba_fps_16000,ba_fps_16000_09]
feature_dim: 6

module_name: "DTSegNetModule"  # modules名称, BADTSegNetModule  DTSegNetModule

exp_name: "exp_DTSegnet_${pretrans_name}"
sample_ratio: 0.2

## 实例分割
#loss_type: "SEG_TAE_TTE_CBL" # 损失函数类型，[SEG_TAE_TTE_CBL, SEG_TAE_TTE, SEG_CBL, SEG]
#net_name: "DTSegNet" # 神经网络名称; 可选 DTSegNet
#net_para_name: "seg_base" # 神经网络参数

# 三种LF分割
loss_type: "SEG_TAE_TTE_CBL" # 损失函数类型，[SEG_TAE_TTE_CBL, SEG_TAE_TTE, SEG_CBL, SEG]
net_name: "DTSegNet" # 神经网络名称; 可选 DTSegNet
net_para_name: "seg_base" # 神经网络参数

#feature_dim: 6
num_classes: 15

lr: 0.002
num_epochs: 30

#------------------------ 路径配置---------------------------#
paths:

  project_dir: "C:/Users/win10/DualMesh/pynb/paraTeeth"
  base_path: "${paths.project_dir}/model/"
  exp_name: ${exp_name}

#  dataset_dir: "E:/mesh_datasets/3DTeeth"

  logger_path: "${paths.base_path}/pl_logs/"
  ckpt_path: "${paths.base_path}/checkpoints/"
  ckpt_name: "latest_checkpoint.tar"
  results_path: "${paths.base_path}/results/"

#------------------------ sam_methods---------------------------#
sam_methods:
  ba_fps_16000:
    _target_: ${transform_module}.BAFPSSample
    num_classes: ${num_classes}
    num_fps_points: 16000
    sam_indexer: ${sam_indexers.nn_sampler} # 嵌套配置 PointSamplingIndexer 派生类
    predictor_type: ${net_name}
    ckpt_path: '${paths.project_dir}/common/DTSegNet.ckpt'
    net_para_name: '${net_para_name}'
    init_ratio: 0.75
    weights_type: 'default'
  ba_fps_16000_09:
    _target_: ${transform_module}.BAFPSSample
    num_classes: 15
    num_fps_points: 16000
    sam_indexer: ${sam_indexers.nn_sampler} # 嵌套配置 PointSamplingIndexer 派生类
    predictor_type: ${net_name}
    ckpt_path: '${paths.project_dir}/common/DTSegNet.ckpt'
    net_para_name: '${net_para_name}'
    init_ratio: 0.9
    weights_type: 'default'

  ba_fps_16000_095:
    _target_: ${transform_module}.BAFPSSample
    num_classes: 15
    num_fps_points: 16000
    sam_indexer: ${sam_indexers.nn_sampler} # 嵌套配置 PointSamplingIndexer 派生类
    predictor_type: ${net_name}
    ckpt_path: '${paths.project_dir}/common/DTSegNet.ckpt'
    net_para_name: '${net_para_name}'
    init_ratio: 0.95
    weights_type: 'default'

#------------------------变换修改---------------------------#
# 使用导入的预处理配置
pretrans_combs:
  qslim_10000:
    _target_: torch_geometric.transforms.Compose
    transforms:
      # normalizations
      - ${normalizations.mean_scale}                   # mean_scale for tadpm
      - ${sam_methods.qslim_10000}                     # qslim sampling
      - ${normalizations.XoYPCA_pose_normalize}
      # sampling
      # generate tae, tte, centroids
      - ${gt_edge_mask.dynamic_radius_nn_edge_mask}    # generate tae, tte
      - ${inst_cent_methods.label_scatter}             # instance centroids
